# Fork-only workflow (main-ex branch of hadi-susanto/gocatcli).
# Push a tag like v1.3.2-ex.1 to build and publish the gocatcli-ex release.
# goreleaser creates the GitHub release with GITHUB_TOKEN, which does not
# trigger the upstream release-binaries / aur-release workflows.
name: release-ex
on:
  push:
    tags:
      - 'v*-ex*'
  workflow_dispatch:

jobs:
  release:
    if: github.repository != 'deadc0de6/gocatcli'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --config .goreleaser-ex.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
